<body>
  <main id="root"></main>
  <div class="backdrop" id="backdrop"><section class="modal" id="modal"></section></div>
  <div class="toast" id="toast"></div>
  <aside class="session-hover-card" id="sessionHover" aria-hidden="true"></aside>
<script>
(() => {
  const API='/.netlify/functions/scheduler-api';
  const DAYS=['Mon','Tue','Wed','Thu','Fri'];
  const TIMES=Array.from({length:16},(_,i)=>String(i+5).padStart(2,'0')+':00');
  const params=new URLSearchParams(location.search);
  const initialMode=params.has('gym')?'gym':params.has('live')?'live':'login';
  const root=document.getElementById('root'), modal=document.getElementById('modal'), backdrop=document.getElementById('backdrop'), toastEl=document.getElementById('toast'), sessionHoverEl=document.getElementById('sessionHover');
  // Keep initial state declarations above helpers, but initialize date values only after the helper functions exist.
  // The previous build evaluated monday()/iso() before their const declarations, which stopped the entire app from rendering.
  let mode=initialMode, state=null, token=sessionStorage.getItem('tf_scheduler_admin_token')||'', activeCoachId='jordan', weekStart=null, gymDate='', poller=null, saving=false, drag=null;
  const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const uid=()=>`${Date.now().toString(36)}_${crypto.getRandomValues(new Uint32Array(1))[0].toString(36)}`;
  const clone=o=>JSON.parse(JSON.stringify(o));
  const iso=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()).toISOString().slice(0,10);
  const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);const shift=(x.getDay()+6)%7;x.setDate(x.getDate()-shift);return x};
  const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
  weekStart=monday(new Date());
  gymDate=iso(new Date());
  const dateFor=(base,index)=>iso(addDays(base,index));
  const dayName=date=>DAYS[(new Date(date+'T12:00:00').getDay()+6)%7];
  const prettyTime=t=>{const [h,m]=t.split(':').map(Number);return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`};
  const prettyDate=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  const fmtDateTime=d=>new Date(d).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  function toast(text,kind=''){toastEl.textContent=text;toastEl.className=`toast show ${kind}`;clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.className='toast',3000)}
  async function api(path='',options={}){
    const headers={'Content-Type':'application/json',...(options.headers||{})}; if(token)headers.Authorization=`Bearer ${token}`;
    let res;
    try{
      res=await fetch(API+path,{...options,headers,cache:'no-store'});
    }catch(networkError){
      const err=new Error('Unable to reach the scheduler server. Please retry in a few seconds.');
      err.status=0; throw err;
    }
    const body=await res.json().catch(()=>({ok:false,error:'The scheduler server returned an unexpected response.'}));
    if(!res.ok||body.ok===false){const err=new Error(body.error||'Scheduler server request failed.');err.status=res.status;err.data=body;throw err}
    return body;
  }
  function coach(id){return state?.coaches?.find(c=>c.id===id)||state?.coaches?.[0]||null}
  function type(id){return state?.classTypes?.find(t=>t.id===id)||state?.classTypes?.[0]||{name:'Session',color:'#1F8CFF',duration:60,visible:true}}
  function clientsForSession(id){return (state.bookings||[]).filter(b=>b.sessionId===id&&['approved','confirmed'].includes(b.status||'approved')).map(b=>state.clients?.find(c=>c.id===b.clientId)||b.client||{}).filter(Boolean)}
  const ATTENDANCE=['unmarked','present','late','absent','excused'];
  const attendanceLabel=v=>({unmarked:'Unmarked',present:'Present',late:'Late',absent:'Absent',excused:'Excused'}[v]||'Unmarked');
  function bookingFor(sessionId,clientId){return (state.bookings||[]).find(b=>b.sessionId===sessionId&&b.clientId===clientId)||null}
  function attendanceOptions(selected='unmarked'){return ATTENDANCE.map(v=>`<option value="${v}" ${v===(selected||'unmarked')?'selected':''}>${attendanceLabel(v)}</option>`).join('')}
  function bookedCount(s){return s.bookedCount ?? clientsForSession(s.id).length}
  function isAvailable(coachId,date,time){return !!state?.availability?.[coachId]?.[dayName(date)]?.[time]}
  function sessionsAt(date,time,coachId){return (state?.sessions||[]).filter(s=>s.date===date&&s.time===time&&s.coachId===coachId&&s.status!=='canceled')}
  function activeCoaches(){return (state?.coaches||[]).filter(c=>c.active!==false)}

      id:item.id||`legacy_session_${i+1}`,
      classTypeId:typeIds.has(item.classTypeId)?item.classTypeId:next.classTypes[0]?.id,

    }

  }
  async function migrateLegacyIfNeeded(server){
    const migrationFlag='tf_scheduler_v22_legacy_migrated';

    const raw=localStorage.getItem('tf_scheduler_v5');
    if(!raw || server.revision!==1 || server.sessions.length || server.clients.length || server.bookings.length || server.requests.length) return server;
    try{
      const legacy=JSON.parse(raw);
      if(!Array.isArray(legacy.sessions)&&!Array.isArray(legacy.classTypes)) return server;
      const imported=convertLegacyState(legacy,server);

  }

  function addPayrollSheet(workbook,data){
    const ws=workbook.addWorksheet('Coach Payroll',{views:[{state:'frozen',ySplit:4}]});const cols=[{header:'Coach',width:20},{header:'Role',width:18},{header:'Sessions',width:11},{header:'Scheduled Hours',width:16},{header:'Group',width:10},{header:'Semi-Private',width:15},{header:'1-on-1',width:11},{header:'Pay Rate / Hr',width:16},{header:'Estimated Payroll',width:19},{header:'Booked Clients',width:16},{header:'Present',width:11},{header:'Late',width:9},{header:'Absent',width:10},{header:'Attendance %',width:15}];setupExcelSheet(ws,'Coach Payroll Summary',`Reporting period: ${reportScopeText(data.filters)} · Scheduled hours × stored coach pay rate`,cols);
    const rows=[];for(const c of (state.coaches||[]).filter(c=>data.filters.coachId==='all'||c.id===data.filters.coachId)){const sessions=data.sessions.filter(r=>r.session.coachId===c.id);if(!sessions.length)continue;const hours=round2(sessions.reduce((n,r)=>n+(r.session.durationMinutes||60)/60,0));const booked=sessions.reduce((n,r)=>n+r.bookings.length,0),present=sessions.reduce((n,r)=>n+r.attendance.present,0),late=sessions.reduce((n,r)=>n+r.attendance.late,0),absent=sessions.reduce((n,r)=>n+r.attendance.absent,0),rate=Number(c.payRate)||0;rows.push({c,sessions,hours,booked,present,late,absent,rate,group:sessions.filter(r=>r.session.kind==='Group').length,semi:sessions.filter(r=>r.session.kind==='Semi-Private').length,one:sessions.filter(r=>r.session.kind==='1-on-1').length})}
    rows.forEach((r,i)=>{const excelRow=ws.addRow([r.c.name,r.c.role,r.sessions.length,r.hours,r.group,r.semi,r.one,r.rate,null,r.booked,r.present,r.late,r.absent,r.booked?round2((r.present+r.late)/r.booked):0]);const rowNo=excelRow.number;excelRow.getCell(4).numFmt='0.00';excelRow.getCell(8).numFmt='$#,##0.00';excelRow.getCell(9).value={formula:`D${rowNo}*H${rowNo}`,result:round2(r.hours*r.rate)};excelRow.getCell(9).numFmt='$#,##0.00';excelRow.getCell(14).numFmt='0%';});styleExcelRows(ws,5,cols);if(rows.length){const total=ws.addRow(['TOTAL','', {formula:`SUM(C5:C${4+rows.length})`},{formula:`SUM(D5:D${4+rows.length})`},{formula:`SUM(E5:E${4+rows.length})`},{formula:`SUM(F5:F${4+rows.length})`},{formula:`SUM(G5:G${4+rows.length})`},'',{formula:`SUM(I5:I${4+rows.length})`},{formula:`SUM(J5:J${4+rows.length})`},{formula:`SUM(K5:K${4+rows.length})`},{formula:`SUM(L5:L${4+rows.length})`},{formula:`SUM(M5:M${4+rows.length})`},'']);total.eachCell(cell=>{cell.font={name:'Aptos',size:10,bold:true,color:{argb:'F8F1E3'}};cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'1F8CFF'}}});total.getCell(4).numFmt='0.00';total.getCell(9).numFmt='$#,##0.00'}return ws;
  }
  function addClientSummarySheet(workbook,data){
    const ws=workbook.addWorksheet('Client Attendance',{views:[{state:'frozen',ySplit:4}]});const cols=[{header:'Client',width:24},{header:'Email',width:30},{header:'Phone',width:17},{header:'Package',width:22},{header:'Charge Date',width:15},{header:'Sessions Booked',width:16},{header:'Present',width:10},{header:'Late',width:9},{header:'Absent',width:10},{header:'Excused',width:11},{header:'Unmarked',width:12},{header:'Attendance %',width:15}];setupExcelSheet(ws,'Client Attendance Summary',`Reporting period: ${reportScopeText(data.filters)} · Active approved/confirmed bookings`,cols);
    const maps=new Map();data.sessions.forEach(r=>r.bookings.forEach(b=>{const c=state.clients.find(x=>x.id===b.clientId)||{id:b.clientId,name:'Client',email:'',phone:'',package:'Unassigned'};if(!maps.has(c.id))maps.set(c.id,{client:c,booked:0,present:0,late:0,absent:0,excused:0,unmarked:0});const row=maps.get(c.id);row.booked++;row[b.attendance||'unmarked']++;}));[...maps.values()].sort((a,b)=>a.client.name.localeCompare(b.client.name)).forEach(r=>{const c=r.client, excelRow=ws.addRow([c.name,c.email||'',c.phone||'',c.package||'Unassigned',c.chargeDate?reportDate(c.chargeDate):'',r.booked,r.present,r.late,r.absent,r.excused,r.unmarked,r.booked?round2((r.present+r.late)/r.booked):0]);excelRow.getCell(5).numFmt='mmm d, yyyy';excelRow.getCell(12).numFmt='0%'});styleExcelRows(ws,5,cols);return ws;
  }
  function addClassSummarySheet(workbook,data){
    const ws=workbook.addWorksheet('Class Type Summary',{views:[{state:'frozen',ySplit:4}]});const cols=[{header:'Class Type',width:24},{header:'Intensity',width:22},{header:'Sessions',width:12},{header:'Scheduled Hours',width:16},{header:'Booked Clients',width:16},{header:'Present',width:11},{header:'Late',width:9},{header:'Absent',width:10},{header:'Attendance %',width:15}];setupExcelSheet(ws,'Class Type Summary',`Reporting period: ${reportScopeText(data.filters)} · Training volume by class type`,cols);const summary=new Map();data.sessions.forEach(r=>{const key=r.type?.id||r.session.classTypeId;if(!summary.has(key))summary.set(key,{type:r.type,sessions:0,hours:0,booked:0,present:0,late:0,absent:0});const x=summary.get(key);x.sessions++;x.hours+=(r.session.durationMinutes||60)/60;x.booked+=r.bookings.length;x.present+=r.attendance.present;x.late+=r.attendance.late;x.absent+=r.attendance.absent;});[...summary.values()].sort((a,b)=>(a.type?.name||'').localeCompare(b.type?.name||'')).forEach(x=>{const excelRow=ws.addRow([x.type?.name||'Session',x.type?.intensity||'Training',x.sessions,round2(x.hours),x.booked,x.present,x.late,x.absent,x.booked?round2((x.present+x.late)/x.booked):0]);excelRow.getCell(4).numFmt='0.00';excelRow.getCell(9).numFmt='0%'});styleExcelRows(ws,5,cols);return ws;
  }
  function addOverviewSheet(workbook,data){
    const ws=workbook.addWorksheet('Report Overview',{views:[{state:'frozen',ySplit:4}]});applyExcelHeader(ws,'Tifton Fitness · Training Report',`Reporting period: ${reportScopeText(data.filters)} · Generated ${new Date().toLocaleString()}`,8);ws.getColumn(1).width=28;ws.getColumn(2).width=18;ws.getColumn(3).width=4;ws.getColumn(4).width=30;ws.getColumn(5).width=18;ws.getColumn(6).width=4;ws.getColumn(7).width=24;ws.getColumn(8).width=18;ws.addRow([]);const metrics=reportMetrics(data);const blocks=[['Sessions',metrics.sessions],['Scheduled Hours',metrics.hours],['Booked Clients',metrics.booked],['Attendance Marked',`${metrics.marked}/${metrics.booked}`],['Present / Late',metrics.present],['Attendance Rate',`${metrics.attendanceRate}%`]];for(let i=0;i<blocks.length;i+=2){const row=ws.addRow([blocks[i][0],blocks[i][1],'',blocks[i+1]?.[0]||'',blocks[i+1]?.[1]||'']);row.height=27;[1,4].forEach(col=>{const cell=row.getCell(col);cell.font={name:'Aptos',size:10,bold:true,color:{argb:'A9B4C2'}};cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'101A26'}}});[2,5].forEach(col=>{const cell=row.getCell(col);cell.font={name:'Aptos Display',size:16,bold:true,color:{argb:'F8F1E3'}};cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'0D121A'}};cell.alignment={horizontal:'right',vertical:'middle'}})}ws.addRow([]);const start=ws.rowCount+1;ws.mergeCells(`A${start}:H${start}`);ws.getCell(`A${start}`).value='Workbook Contents';ws.getCell(`A${start}`).font={name:'Aptos',size:12,bold:true,color:{argb:'F8F1E3'}};ws.getCell(`A${start}`).fill={type:'pattern',pattern:'solid',fgColor:{argb:'1F8CFF'}};const notes=[['Session Register','Every scheduled session, booked count, attendance totals, coach, hours, and notes.'],['Attendance Detail','One row per booked client with package/contact details and attendance marker.'],['Coach Payroll','Scheduled hours, stored rate per hour, formula-based estimated payroll, format mix, and attendance.'],['Client Attendance','Client-level attendance totals across the selected period.'],['Class Type Summary','Training session volume and attendance by class type.']];notes.forEach(n=>{const r=ws.addRow(n);r.getCell(1).font={bold:true,color:{argb:'F8F1E3'}};r.getCell(2).font={color:{argb:'A9B4C2'}};r.getCell(2).alignment={wrapText:true};r.height=24});return ws;
  }
  async function exportExcelReport(kind,data){
    const sourceButton={training:'exportTrainingWorkbook',payroll:'exportPayrollWorkbook',attendance:'exportAttendanceWorkbook'}[kind];const btn=document.getElementById(sourceButton);const original=btn?.innerHTML;if(btn){btn.disabled=true;btn.innerHTML='<span class="report-loading">Building workbook</span>'}try{const ExcelJS=await ensureExcelJS();const wb=new ExcelJS.Workbook();wb.creator='Tifton Fitness';wb.created=new Date();wb.modified=new Date();wb.properties={title:'Tifton Fitness Training Report',subject:'Training, attendance, and payroll reporting',company:'Tifton Fitness'};if(kind==='training'){addOverviewSheet(wb,data);addSessionRegisterSheet(wb,data);addAttendanceSheet(wb,data);addPayrollSheet(wb,data);addClientSummarySheet(wb,data);addClassSummarySheet(wb,data)}else if(kind==='payroll'){addOverviewSheet(wb,data);addPayrollSheet(wb,data);addSessionRegisterSheet(wb,data)}else{addOverviewSheet(wb,data);addAttendanceSheet(wb,data);addSessionRegisterSheet(wb,data);addClientSummarySheet(wb,data)}const buffer=await wb.xlsx.writeBuffer();const suffix=kind==='training'?'training-sessions':kind==='payroll'?'coach-payroll':'attendance-register';downloadBlob(`tifton-fitness-${suffix}-${fileStamp()}.xlsx`,new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));toast('Excel workbook exported.')}catch(error){console.error('Excel export failed',error);toast(error.message||'Excel export failed.','error')}finally{if(btn){btn.disabled=false;btn.innerHTML=original}}}

  async function openBackups(){let data;try{data=await api('?scope=backups')}catch(e){toast(e.message,'error');return}const list=data.backups||[];openModal(`<div class="modal-head"><div><h2>Backups & Export</h2><p>Every server save creates a recoverable snapshot. Download a full backup before major upgrades.</p></div><button class="btn ghost" onclick="closeModal()">Close</button></div><div class="modal-grid"><section class="card"><div class="section-title"><h2>Full Export</h2><span>portable JSON</span></div><p class="hint">Contains sessions, class types, coaches, availability, clients, bookings, and requests.</p><div class="modal-actions" style="justify-content:flex-start"><button class="btn primary" id="downloadBackup">Download Full Backup</button><button class="btn" id="uploadBackup">Restore from File</button><input id="backupFile" type="file" accept="application/json,.json" class="hidden"></div></section><section class="card"><div class="section-title"><h2>Automatic Server Snapshots</h2><span>latest ${list.length}</span></div><div class="backup-list">${list.length?list.map(x=>`<div class="backup-row"><div><b>Revision ${x.revision}</b><small>${fmtDateTime(x.createdAt)} · ${esc(x.reason||'state save')}</small></div><button class="btn ghost" data-restore="${esc(x.id)}">Restore</button></div>`).join(''):'<div class="empty">Snapshots appear after the first save.</div>'}</div></section></div>`);document.getElementById('downloadBackup').onclick=()=>download(`tf-scheduler-backup-${iso(new Date())}.json`,{schema:'tf-scheduler-backup-v1',exportedAt:new Date().toISOString(),state});document.getElementById('uploadBackup').onclick=()=>document.getElementById('backupFile').click();document.getElementById('backupFile').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(async txt=>{try{const obj=JSON.parse(txt);if(!obj.state||!confirm('Restore this full backup? Current state will be snapshotted first.'))return;const r=await api('',{method:'POST',body:JSON.stringify({action:'restore',state:obj.state})});state=r.state;render();closeModal();toast('Backup restored securely.')}catch(err){toast('That backup file could not be restored.','error')}})};modal.querySelectorAll('[data-restore]').forEach(b=>b.onclick=async()=>{if(!confirm('Restore this server snapshot? Current state will be snapshotted first.'))return;try{const r=await api('',{method:'POST',body:JSON.stringify({action:'restore-backup',backupId:b.dataset.restore})});state=r.state;render();closeModal();toast('Server snapshot restored.')}catch(e){toast(e.message,'error')}})}
  function download(name,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  async function commit(mutator,message){const before=clone(state);mutator(state);try{await commitState(message)}catch(e){if(!(e.status===409&&e.data?.state)){state=before;render()}throw e}}
  async function commitState(message){if(saving)throw new Error('A previous change is still saving.');saving=true;render();try{const r=await api('',{method:'POST',body:JSON.stringify({action:'save',state,baseRevision:state.revision,reason:message})});state=r.state;state.updatedAt=r.state.updatedAt;toast(message)}catch(e){if(e.status===409&&e.data?.state){state=e.data.state;toast('A newer version was found. Reloaded server changes; try again.','error')}throw e}finally{saving=false;render()}}
  function renderConnectionError(error){
    const detail=error?.message||'The shared schedule service is unavailable.';
    root.innerHTML=`<section class="login"><div class="login-card"><div class="mark">TF</div><div class="eyebrow" style="margin-top:15px">Schedule connection</div><h1>Unable to load the live schedule</h1><p class="login-copy">${esc(detail)} Please refresh in a moment. The coach portal and public feeds use the same server-backed schedule.</p><div class="login-actions"><button class="btn primary" id="retryLoad">Retry</button><a class="btn ghost" href="index.html">Coach Sign In</a></div></div></section>`;
    document.getElementById('retryLoad')?.addEventListener('click',()=>{root.innerHTML='<section class="login"><div class="login-card"><div class="mark">TF</div><h1>Connecting…</h1></div></section>';fetchState()});
  }
  async function fetchState(){
    try{
      const scope=mode==='coach'?'admin':'public';
      const r=await api(`?scope=${scope}`);
      const incoming=r.state;
      if(!incoming) throw new Error('The scheduler service returned no schedule data.');
      if(!state||incoming.revision!==state.revision){state=incoming;render()}
      return true;
    }catch(e){
      if(mode==='coach'&&e.status===401){
        token='';
        sessionStorage.removeItem('tf_scheduler_admin_token');
        mode='login';
        state=null;
        render();
      } else {
        console.warn('Scheduler state could not load.',e);
        if(!state) renderConnectionError(e);
      }
      return false;
    }
  }
  function startPolling(){stopPolling();poller=setInterval(fetchState,mode==='coach'?3500:3000)}function stopPolling(){if(poller)clearInterval(poller);poller=null}
  async function boot(){
    if(mode==='login'){renderLogin();return}
    const loaded=await fetchState();
    if(loaded) startPolling();
  }
  boot();
})();
